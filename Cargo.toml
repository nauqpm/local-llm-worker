[package]
name = "ollama-worker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lightweight, strongly typed Local LLM Worker for Ollama and AI agent orchestration"
readme = "README.md"

[lib]
name = "ollama_worker"
path = "src/lib.rs"

[[bin]]
name = "ollama-worker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
