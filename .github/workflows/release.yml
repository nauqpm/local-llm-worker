name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-musl:
    name: Build Static Linux amd64 Binary (musl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust stable toolchain with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run full offline test suite before release build
        run: cargo test --all-targets --locked

      - name: Build static x86_64-unknown-linux-musl release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Smoke-test static binary
        run: |
          BIN="target/x86_64-unknown-linux-musl/release/ollama-worker"
          file "$BIN"
          "$BIN" --version
          "$BIN" --help

      - name: Package release archive and SHA-256 checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIST="dist"
          ARCHIVE="ollama-worker-${TAG}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$DIST/stage"
          cp target/x86_64-unknown-linux-musl/release/ollama-worker "$DIST/stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$DIST/stage/"
          tar -C "$DIST/stage" -czf "$DIST/$ARCHIVE" .
          (cd "$DIST" && sha256sum "$ARCHIVE" > SHA256SUMS.txt)
          cat "$DIST/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-worker-linux-amd64-musl
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
